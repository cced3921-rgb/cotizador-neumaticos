services:
  - type: web
    name: cotizador-neumaticos
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: datos-cotizador
      mountPath: /var/data
      sizeGB: 1
